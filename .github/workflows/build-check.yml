name: Build Check

on:
  pull_request:
    branches:
      - debian/trixie

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    container:
      image: debian:trixie
      options: --privileged --user root

    steps:
      - name: Install dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt update
          apt build-dep -y kwin
          apt install -y git ccache build-essential devscripts fakeroot quilt git-buildpackage pristine-tar

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-kwin-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-kwin-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Clone repository
        run: |
          cd ~
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone -b ${{ github.event.pull_request.head.ref }} --depth 1 ${{ github.event.pull_request.head.repo.html_url }}.git kwin
          cd kwin
          git switch -c ci-build

      - name: Set release name suffix
        shell: bash
        run: |
          cd ~/kwin
          short_hash=$(git rev-parse --short HEAD)
          echo "KWIN_RELEASE_NAME_SUFFIX=${short_hash}_debian_trixie_arm64" >> "$GITHUB_ENV"

      - name: Build KWin
        shell: bash
        run: |
          export CCACHE_DIR=/root/.ccache
          echo "Building KWin..."
          cd ~/kwin
          origtargz
          git add .
          git commit -m "Add source code"
          gbp buildpackage -uc -us -jauto --git-ignore-branch --git-no-pristine-tar
          echo "KWin build completed successfully!"

      - name: Save ccache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: /root/.ccache
          key: ccache-kwin-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect packages for debug
        shell: bash
        run: |
          cd ~
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.deb" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums_debug.txt
          cat sha256sums_debug.txt && echo

      - name: Upload build artifacts for debug
        uses: actions/upload-artifact@v7
        with:
          name: kwin_${{ env.KWIN_RELEASE_NAME_SUFFIX }}_debug
          path: |
            ~/*.deb
            ~/sha256sums_debug.txt
          retention-days: 90

      - name: Collect packages
        shell: bash
        run: |
          cd ~
          rm -f *dev* *dbgsym*
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.deb" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          cat sha256sums.txt && echo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kwin_${{ env.KWIN_RELEASE_NAME_SUFFIX }}
          path: |
            ~/*.deb
            ~/sha256sums.txt
          retention-days: 90
